name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the previous release override
        run: |
          cp examples/local/previous-release.hcl upgrade_override.tf
          conn3x init -backend=false && conn3x validate
          rm upgrade_override.tf

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    env:
      TF_VAR_admin_password: Ci-only-Lab-pass-1
      LAB_PASSWORD: Ci-only-Lab-pass-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          # Podman in the host container needs a rootful, privileged container.
          PODMAN: sudo podman
        run: ./up.sh
      # The members' previous tags, with older Traefik, Homepage and Uptime
      # Kuma releases, so the upgrade below has an install to move.
      - name: Apply the previous release, then plan again with no changes
        working-directory: examples/local
        run: |
          cp previous-release.hcl ../../upgrade_override.tf
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
          sudo podman exec circuit-lempa-homelab traefik version | grep -q 'Version: *3.7.15'
      - name: Use the stack on the previous release
        working-directory: examples/local
        run: &check sudo podman exec -i -e LAB_PASSWORD circuit-lempa-homelab bash -s < check.sh
      - name: Upgrade to the current release, then plan again with no changes
        working-directory: examples/local
        run: |
          rm ../../upgrade_override.tf
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
          sudo podman exec circuit-lempa-homelab traefik version | grep -q 'Version: *3.7.16'
          sudo podman exec circuit-lempa-homelab podman inspect homepage --format '{{.ImageName}}' | grep -q '@sha256:19c5c0918445'
          sudo podman exec circuit-lempa-homelab podman inspect uptime-kuma --format '{{.ImageName}}' | grep -q '@sha256:e88415a90dd2'
      - name: Use the stack after the upgrade
        working-directory: examples/local
        run: *check
      # Every password reaches the host write-only, so state holds none of
      # it, and nothing Conn3x writes under .terraform does either.
      # .terraform/modules is left out: it holds downloaded module code.
      - name: Check the password stays out of state
        working-directory: examples/local
        run: |
          test -s terraform.tfstate || { echo "No terraform.tfstate to check." >&2; exit 1; }
          if grep -rqF --exclude-dir=modules -e "$TF_VAR_admin_password" terraform.tfstate .terraform/; then
            echo "The admin password is in terraform.tfstate or under .terraform/." >&2
            exit 1
          fi
      # Restarting the container boots systemd again, so this checks every
      # service is enabled and comes back.
      - name: Restart the host, then use the stack again
        working-directory: examples/local
        run: |
          sudo podman restart circuit-lempa-homelab
          for _ in $(seq 60); do
            case $(sudo podman exec circuit-lempa-homelab systemctl is-system-running 2>/dev/null) in running|degraded) break ;; esac
            sleep 1
          done
          sudo podman exec -i -e LAB_PASSWORD circuit-lempa-homelab bash -s < check.sh
      - name: Plan again after the restart, with no changes
        working-directory: examples/local
        run: conn3x plan -detailed-exitcode
      # Every other category on, planned against the same host: the members'
      # own validations and the stack's wiring have to agree, for the
      # categories this job doesn't apply too. Wazuh needs a second host,
      # so it's left out here.
      - name: Plan every category
        working-directory: examples/local
        run: |
          cp every-category.hcl every_category_override.tf
          modules="homeassistant ollama openwebui kestra semaphore renovate gitlab gitlab_runner mariadb postgres influxdb authentik suricata portainer dockge"
          # GitLab publishes no packages for Fedora, and its circuits say so.
          if [ "${{ matrix.distro }}" = fedora45 ]; then
            sed -i 's/^  code *= true/  code          = false/' every_category_override.tf
            modules=$(echo "$modules" | sed 's/ gitlab gitlab_runner//')
          fi
          conn3x init
          set +e
          conn3x plan -detailed-exitcode > every.log 2>&1
          code=$?
          set -e
          rm every_category_override.tf
          [ "$code" = 2 ] || { cat every.log; exit 1; }
          for m in $modules; do
            grep -q "module.homelab.module.$m\[0\]" every.log || { echo "The plan has nothing for $m." >&2; exit 1; }
          done
          if grep -qF -e "$TF_VAR_admin_password" -e placeholder every.log; then
            echo "A secret is in the plan." >&2
            exit 1
          fi
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh
